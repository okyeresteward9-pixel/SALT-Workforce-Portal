[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
extend-exclude = ["venv", ".venv", "static", "migrations"]
target-version = "py311"

[tool.ruff.lint]
# Start with real-bug rules only (syntax errors, undefined names, broken comparisons).
# Add "F401" (unused imports) and "E" rules gradually as the refactor cleans files up.
select = ["E9", "F63", "F7", "F82"]
